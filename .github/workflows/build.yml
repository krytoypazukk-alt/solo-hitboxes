name: Build Minecraft Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir -p src/main/java/com/egor/solohitboxes/mixin
          mkdir -p src/main/resources
          mv EntityMixin.java src/main/java/com/egor/solohitboxes/mixin/
          mv fabric.mod.json src/main/resources/
          mv solo_hitboxes.mixins.json src/main/resources/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'gradle-version: '8.7'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: solo-hitboxes
          path: build/libs/*.jar
